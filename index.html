<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Sudoku</title>
    <meta name="description" content="A premium 9x9 Sudoku game with generator, solver, and timer.">
    <!-- Google Fonts for Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Header Section -->
        <header>
            <div class="logo">
                <h1>Zenith<span class="highlight">Sudoku</span></h1>
            </div>
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-label">Time</span>
                    <span id="timer" class="stat-value">00:00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Difficulty</span>
                    <span class="stat-value">Master</span>
                </div>
            </div>
        </header>

        <!-- Main Game Area -->
        <main>
            <div class="game-board-wrapper">
                <div id="sudoku-grid" class="sudoku-grid">
                    <!-- Cells will be generated by JS -->
                </div>
            </div>

            <!-- Numpad for Mobile / Quick Entry -->
            <div class="numpad">
                <button class="num-btn" data-value="1">1</button>
                <button class="num-btn" data-value="2">2</button>
                <button class="num-btn" data-value="3">3</button>
                <button class="num-btn" data-value="4">4</button>
                <button class="num-btn" data-value="5">5</button>
                <button class="num-btn" data-value="6">6</button>
                <button class="num-btn" data-value="7">7</button>
                <button class="num-btn" data-value="8">8</button>
                <button class="num-btn" data-value="9">9</button>
                <button class="num-btn action" id="btn-erase" title="Erase">⌫</button>
            </div>
        </main>

        <!-- Controls Section -->
        <footer class="controls">
            <button id="btn-new-game" class="btn secondary">New Game</button>
            <button id="btn-check" class="btn primary">Check Solution</button>
            <button id="btn-solve" class="btn danger">Solve</button>
        </footer>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Spectacular!</h2>
            <p>You solved the puzzle in <span id="final-time"></span>.</p>
            <button id="btn-play-again" class="btn primary">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
